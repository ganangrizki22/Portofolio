<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon: diamond biru sederhana, dibuat langsung sebagai SVG data URI
         supaya tidak perlu file terpisah. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 96,50 50,96 4,50' fill='%232563eb'/%3E%3C/svg%3E"
    />

    <title>Ganang Rizki Haryadi — Frontend Developer</title>
    <meta
      name="description"
      content="Portofolio Ganang Rizki Haryadi, Frontend Developer berpengalaman membangun antarmuka web modern dan responsif dengan React, Vue.js, dan Node.js."
    />
    <meta name="theme-color" content="#121212" />
    <!-- TODO: setelah situs ini di-hosting di domain publik, tambahkan di sini:
         <link rel="canonical" href="https://domain-kamu.com" />
         <meta property="og:url" content="https://domain-kamu.com" />
         supaya search engine & preview link menunjuk ke URL yang benar. -->

    <!-- Open Graph (preview saat link dibagikan di WhatsApp, LinkedIn, dll.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ganang Rizki Haryadi — Frontend Developer" />
    <meta
      property="og:description"
      content="Portofolio Ganang Rizki Haryadi, Frontend Developer berpengalaman membangun antarmuka web modern dan responsif dengan React, Vue.js, dan Node.js."
    />
    <meta property="og:image" content="/assets/og-banner.jpg" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ganang Rizki Haryadi — Frontend Developer" />
    <meta
      name="twitter:description"
      content="Portofolio Ganang Rizki Haryadi, Frontend Developer berpengalaman membangun antarmuka web modern dan responsif."
    />
    <meta name="twitter:image" content="/assets/og-banner.jpg" />

    <!-- Ikon (bootstrap-icons) dan font (Karla, Nanum Pen Script) di-bundle
         secara lokal lewat main.jsx (paket npm), bukan lewat CDN jsDelivr /
         Google Fonts lagi -- supaya situs tetap tampil benar meski koneksi
         ke CDN lambat/diblokir, tidak ada flash-of-unstyled-text, dan tidak
         ada request pihak ketiga ke browser pengunjung. -->

    <!-- Data terstruktur (JSON-LD) supaya mesin pencari bisa menampilkan
         hasil yang lebih kaya (nama, profesi, tautan sosial) untuk halaman
         ini. Perbarui manual di sini jika nama/jabatan/tautan sosial di
         profile.json berubah. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ganang Rizki Haryadi",
        "jobTitle": "Frontend Developer",
        "description": "Frontend Developer berpengalaman membangun antarmuka web modern dan responsif dengan React, Vue.js, dan Node.js.",
        "image": "/assets/avatar.jpg",
        "email": "mailto:radenmasganang22@gmail.com",
        "sameAs": [
          "https://github.com/ganangrizki22",
          "https://www.linkedin.com/in/ganang-rizki-haryadi-37ba40238/",
          "https://instagram.com/delita.hy",
          "https://www.facebook.com/ganangrizki.haryadi/"
        ]
      }
    </script>
  </head>
  <body>
    <a href="#hero" class="skip-link">Langsung ke konten utama</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
